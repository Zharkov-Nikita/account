version: "3.9"
services:
  postgres:
    image: postgres:17
    container_name: book-dbs
    ports: [ "5132:5432" ]
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    volumes:
      - ./docker/volumes/postgres:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped